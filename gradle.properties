org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Plugin properties
plugin_id=mobhealth
plugin_name=MobHealth
plugin_version=10.0.0
plugin_group_id=com.sablednah.mobhealth
plugin_authors=Sablednah
plugin_description=Shows the damage you deal and the health a mob has left: chat, action bar, nameplate bars, boss bars and floating damage numbers.

## API versions each module compiles against. Runtime support is wider than these: a module
## compiled against 1.7.2 runs on every later server, and an adapter compiled against 1.19.4 is only
## loaded once the server says it is 1.19.4 or newer.
bukkit_api_floor=1.7.2-R0.3
spigot_api_1_8=1.8.8-R0.1-SNAPSHOT
spigot_api_1_12=1.12.2-R0.1-SNAPSHOT
spigot_api_1_14=1.14.4-R0.1-SNAPSHOT
spigot_api_1_18=1.18.2-R0.1-SNAPSHOT
spigot_api_1_19=1.19.4-R0.1-SNAPSHOT
bukkit_api_beta=1.7.3-R3

## The API lines the apiCheck task re-compiles the plugin sources against, so a method that a newer
## API removed shows up here as a compile error rather than as a NoSuchMethodError on somebody's
## server. Comma-separated spigot-api versions.
api_check_versions=1.13.2-R0.1-SNAPSHOT,1.16.5-R0.1-SNAPSHOT,1.20.4-R0.1-SNAPSHOT,1.21.11-R0.1-SNAPSHOT,26.3-R0.1-SNAPSHOT
